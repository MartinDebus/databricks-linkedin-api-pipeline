resources:
  jobs:
    linkedin_medallion:
      name: linkedin-medallion
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Berlin"
        pause_status: UNPAUSED

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.bronze_linkedin.name}
        - name: volume
          default: ${resources.volumes.landing.name}
        - name: run_type
          default: ${var.run_type}

      run_as:
        service_principal_name: ${var.service_principal_app_id}

      tags:
        project: linkedin

      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/ingest.ipynb
          environment_key: serverless

        - task_key: transform
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.linkedin_transform.id}

      environments:
        - environment_key: serverless
          spec:
            client: "4"

